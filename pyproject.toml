[project]
name = "nobg"
dynamic = ["version"]
description = "Open source background removal models for image and video matting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Hafedh Hichri", email = "lain@chonkie.ai" },
]
keywords = ["matting", "background-removal", "deep-learning", "pytorch", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.0",
    "huggingface_hub>=1.22.0",
    "transformers[torch]>=5.0",
    "torchvision>=0.27.1",
    "loadimg>=0.5.0",
    "datasets>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "ty>=0.0.57",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "matplotlib>=3.0",
]

[project.urls]
Homepage = "https://github.com/feyninc/nobg"
Repository = "https://github.com/feyninc/nobg"
Issues = "https://github.com/feyninc/nobg/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nobg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nobg"]
