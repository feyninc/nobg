[project]
name = "nobg"
dynamic = ["version"]
description = "Open source background removal models for image matting"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Hafedh Hichri", email = "lain@chonkie.ai" },
]
keywords = ["matting", "background-removal", "deep-learning", "pytorch", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.0",
    "huggingface_hub>=1.22.0",
    "transformers[torch]>=5.4",
    "torchvision>=0.15.0",
    "loadimg>=0.5.0",
    "datasets>=5.0.0",
    "ty>=0.0.61",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "ty>=0.0.61",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "matplotlib>=3.10",
]
train = [
    "python-dotenv>=1.0",
    "wandb>=0.17",
]

[project.urls]
Homepage = "https://github.com/feyninc/nobg"
Repository = "https://github.com/feyninc/nobg"
Issues = "https://github.com/feyninc/nobg/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nobg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nobg"]
