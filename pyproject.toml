[project]
name = "nobg"
dynamic = ["version"]
description = "Open source background removal models for image matting"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Hafedh Hichri", email = "lain@chonkie.ai" },
]
keywords = ["matting", "background-removal", "deep-learning", "pytorch", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "huggingface_hub>=1.22.0",
    "transformers>=5.5",
    "loadimg>=0.5.0",
    "datasets>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "ty>=0.0.61",
    # the framework itself: left out of `dependencies` so installing nobg does
    # not pick a torch build for you, and pulled in here for the test suite
    "torch>=2.0",
    "torchvision>=0.15.0",
    # same as the `onnx` extra, so the ONNX round-trip tests run under `uv sync`
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.1",
]
notebooks = [
    { include-group = "dev" },
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "matplotlib>=3.10",
]
train = [
    { include-group = "dev" },
    "peft>=0.17",
    "python-dotenv>=1.0",
    "wandb>=0.17",
]

[project.optional-dependencies]
# `onnx_save_pretrained` / `onnx_from_pretrained`: onnxscript backs torch's
# torch.export-based exporter, onnxruntime runs the exported graph.
onnx = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.1",
]

[project.urls]
Homepage = "https://github.com/feyninc/nobg"
Repository = "https://github.com/feyninc/nobg"
Issues = "https://github.com/feyninc/nobg/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nobg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nobg"]
